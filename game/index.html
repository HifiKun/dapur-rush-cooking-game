<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Rush — Warung Nusantara</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b2118;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    width: 1280px;
    height: 720px;
    max-width: 96vw;
    max-height: 86vh;
    background: #f7e8d0;
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  #bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1280px;
    margin: 10px auto 0;
    color: #e8d9b0;
    font-size: 13px;
  }
  #bar button {
    background: #7a4a21;
    color: #fff8e7;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  #bar button:hover { background: #96602c; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="bar">
    <span>Dapur Rush — masak cepat, sajikan tepat. Klik bahan atau tekan 1–6, Spasi menyajikan, P jeda.</span>
    <button id="mute" type="button">Suara: hidup (M)</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
